<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistem Data Undangan Pernikahan{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Cinzel', 'Georgia', 'serif'],
                    },
                    colors: {
                        brand: {
                            cream: '#F6F2E6',
                            charcoal: '#292929',
                            pine: '#33443C',
                            gold: '#EACE9C',
                            // Palette scale based on user's 4 colors:
                            50: '#FAF8F2',
                            100: '#F6F2E6', // Cream / Off-White
                            200: '#EDE4D0',
                            300: '#E2D3B8',
                            400: '#EACE9C', // Warm Gold / Sand
                            500: '#D5B47B',
                            600: '#33443C', // Deep Pine Green
                            700: '#2A3831',
                            800: '#292929', // Dark Charcoal
                            900: '#1A1A1A',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth transitions & custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F6F2E6;
        }
        ::-webkit-scrollbar-thumb {
            background: #D5B47B;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #33443C;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid #EDE4D0;
        }
        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateY(-16px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .toast-animate-in {
            animation: toastSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#F8F6F0] text-brand-charcoal font-sans min-h-screen flex flex-col antialiased selection:bg-brand-pine selection:text-white">

    <!-- Global Floating Toast Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-[9999] space-y-3 max-w-sm w-full px-4 pointer-events-none"></div>

    <!-- Global Modern Confirm Modal -->
    <div id="global-confirm-modal" class="fixed inset-0 z-[9998] bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-7 shadow-2xl border border-brand-200 space-y-4 toast-animate-in">
            <div class="flex items-center gap-3">
                <div id="confirm-modal-icon-bg" class="w-11 h-11 rounded-2xl bg-brand-100 text-brand-pine flex items-center justify-center flex-shrink-0">
                    <i id="confirm-modal-icon" data-lucide="help-circle" class="w-6 h-6"></i>
                </div>
                <div>
                    <h3 id="confirm-modal-title" class="text-base font-bold text-brand-charcoal">Konfirmasi</h3>
                    <p id="confirm-modal-message" class="text-xs text-slate-500 mt-0.5 leading-relaxed">Apakah Anda yakin ingin melanjutkan tindakan ini?</p>
                </div>
            </div>
            <div class="flex items-center gap-2.5 pt-3 border-t border-brand-100">
                <button type="button" id="confirm-modal-btn-cancel"
                        class="flex-1 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
                    Batal
                </button>
                <button type="button" id="confirm-modal-btn-ok"
                        class="flex-1 py-2.5 rounded-xl bg-brand-pine hover:bg-brand-800 text-white text-xs font-semibold shadow-md transition">
                    Ya, Lanjutkan
                </button>
            </div>
        </div>
    </div>

    <!-- Flash Notifications from Flask -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                {% for category, message in messages %}
                    showToast({{ message|tojson }}, {{ category|tojson }});
                {% endfor %}
            });
        </script>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script>
        // Init Lucide icons
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });

        // ================= MODERN TOAST NOTIFICATION SYSTEM =================
        function showToast(message, type = 'success', duration = 3500) {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = 'pointer-events-auto toast-animate-in flex items-start gap-3 p-4 rounded-2xl shadow-xl bg-white/95 backdrop-blur-md border text-xs transition-all duration-300 relative overflow-hidden';
            
            let iconName = 'check-circle-2';
            let iconBg = 'bg-brand-100 text-brand-pine';
            let borderColor = 'border-brand-300';
            let titleText = 'Berhasil';

            if (type === 'error' || type === 'danger') {
                iconName = 'alert-circle';
                iconBg = 'bg-rose-100 text-rose-600';
                borderColor = 'border-rose-200';
                titleText = 'Perhatian';
            } else if (type === 'warning') {
                iconName = 'alert-triangle';
                iconBg = 'bg-amber-100 text-amber-600';
                borderColor = 'border-amber-200';
                titleText = 'Peringatan';
            } else if (type === 'info') {
                iconName = 'info';
                iconBg = 'bg-brand-100 text-brand-pine';
                borderColor = 'border-brand-gold';
                titleText = 'Informasi';
            }

            toast.classList.add(borderColor);

            toast.innerHTML = `
                <div class="w-8 h-8 rounded-xl ${iconBg} flex items-center justify-center flex-shrink-0 mt-0.5">
                    <i data-lucide="${iconName}" class="w-4 h-4"></i>
                </div>
                <div class="flex-1 min-w-0 pr-1">
                    <div class="font-bold text-brand-charcoal text-[13px]">${titleText}</div>
                    <div class="text-slate-600 mt-0.5 leading-relaxed font-medium">${message}</div>
                </div>
                <button type="button" class="text-slate-400 hover:text-brand-charcoal p-1 transition flex-shrink-0" onclick="this.parentElement.remove()">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
                <div class="absolute bottom-0 left-0 right-0 h-1 bg-slate-100">
                    <div class="h-full bg-brand-pine transition-all linear" style="width: 100%; transition-duration: ${duration}ms;"></div>
                </div>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            // Progress shrink
            const prog = toast.querySelector('.bg-brand-pine');
            setTimeout(() => {
                if (prog) prog.style.width = '0%';
            }, 30);

            // Auto dismiss
            const timer = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, duration);

            toast.addEventListener('mouseenter', () => clearTimeout(timer));
        }

        // Override native window.alert with modern showToast
        window.alert = function(msg) {
            showToast(msg, 'info');
        };

        // ================= MODERN CONFIRM MODAL SYSTEM =================
        function showConfirm({ title = 'Konfirmasi', message, confirmText = 'Ya, Lanjutkan', cancelText = 'Batal', isDanger = false }) {
            return new Promise((resolve) => {
                const modal = document.getElementById('global-confirm-modal');
                const titleElem = document.getElementById('confirm-modal-title');
                const msgElem = document.getElementById('confirm-modal-message');
                const okBtn = document.getElementById('confirm-modal-btn-ok');
                const cancelBtn = document.getElementById('confirm-modal-btn-cancel');
                const iconBg = document.getElementById('confirm-modal-icon-bg');
                const iconElem = document.getElementById('confirm-modal-icon');

                titleElem.innerText = title;
                msgElem.innerText = message;
                okBtn.innerText = confirmText;
                cancelBtn.innerText = cancelText;

                if (isDanger) {
                    okBtn.className = 'flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold shadow-md transition';
                    iconBg.className = 'w-11 h-11 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center flex-shrink-0';
                    iconElem.setAttribute('data-lucide', 'alert-triangle');
                } else {
                    okBtn.className = 'flex-1 py-2.5 rounded-xl bg-brand-pine hover:bg-brand-800 text-white text-xs font-semibold shadow-md transition';
                    iconBg.className = 'w-11 h-11 rounded-2xl bg-brand-100 text-brand-pine flex items-center justify-center flex-shrink-0';
                    iconElem.setAttribute('data-lucide', 'help-circle');
                }
                lucide.createIcons();

                modal.classList.remove('hidden');
                modal.classList.add('flex');

                function cleanup(result) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                    okBtn.removeEventListener('click', onOk);
                    cancelBtn.removeEventListener('click', onCancel);
                    resolve(result);
                }

                function onOk() { cleanup(true); }
                function onCancel() { cleanup(false); }

                okBtn.addEventListener('click', onOk);
                cancelBtn.addEventListener('click', onCancel);
            });
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
